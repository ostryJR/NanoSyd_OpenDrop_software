<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenDrop Generator</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="main">
    <div id="work">
      <div id="stage">
        <svg id="board" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"
             role="img" aria-label="OpenDrop electrode array"></svg>
      </div>

      <section id="timing" aria-label="Frame timing">
        <div class="timing-bar">
          <label>Default frame time
            <input type="number" id="time-default" min="0.01" max="3600" step="any" inputmode="decimal"> s</label>
          <label>Frame <span id="time-frame-no">1</span>
            <input type="number" id="time-frame" min="0.01" max="3600" step="any" inputmode="decimal"> s</label>
          <button type="button" id="time-frame-reset">Use default</button>
          <span id="time-total"></span>
          <span class="spacer"></span>
          <span id="chart-legend"><i class="swatch plain"></i>default time<i class="swatch own"></i>own time</span>
          <span class="segmented" role="group" aria-label="Chart">
            <button type="button" data-view="step" aria-pressed="true">Step time</button>
            <button type="button" data-view="total" aria-pressed="false">Total time</button>
            <button type="button" data-view="table" aria-pressed="false">Table</button>
          </span>
        </div>
        <div id="chart"></div>
      </section>
    </div>

  </div>

  <footer id="bar">
    <label>Layout <select id="layout"></select></label>
    <label><input type="checkbox" id="numbers"> Electrode numbers <kbd>N</kbd></label>
    <span id="status" role="status" aria-live="polite"></span>
    <span id="help">
      Drag: path (<kbd>F</kbd> freehand, <kbd>S</kbd> straight, <kbd>P</kbd> paint) ·
      <kbd>Esc</kbd>: cancel · <kbd data-pc="Ctrl+Z">⌘Z</kbd> / <kbd data-pc="Ctrl+Y">⇧⌘Z</kbd>: undo/redo ·
      Click: toggle · <kbd>Shift</kbd>+click: next frame + on ·
      <kbd>←</kbd><kbd>→</kbd> or wheel: frame · <kbd>Space</kbd>: play/stop (wheel: speed)
    </span>
  </footer>

  <input type="file" id="file-input" accept=".json,application/json" hidden>

  <!-- Plain scripts (not modules) so the page also works when opened straight from disk. -->
  <script src="js/layouts-data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/model.js"></script>
  <script src="js/paths.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/jsonio.js"></script>
  <script src="js/view.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
